<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ELMGHARY SHOP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; color: #333; }
        
        /* Login Screen Styles */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #0c0c0c; display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: white; padding: 2rem 3rem; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        .login-box input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; }
        .login-box button { width: 100%; background: #25D366; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .login-box button:hover { background: #1ebe57; }
        #loginError { color: red; margin-top: 10px; display: none; font-size: 0.9rem; }

        /* Dashboard Styles (Hidden initially) */
        #dashboard { display: none; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid #ccc; padding-bottom: 1rem; }
        h1 { color: #0c0c0c; }
        .back-link { background: #0c0c0c; color: white; text-decoration: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; border: none; font-size: 1rem;}
        
        .table-container { background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }
        .no-orders { text-align: center; padding: 2rem; color: #888; }
        .clear-btn { background: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>Admin Access</h2>
            <input type="password" id="adminPass" placeholder="Enter Password">
            <button onclick="checkLogin()">Login</button>
            <p id="loginError">Incorrect password.</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard">
        <div class="header">
            <h1>Admin Dashboard - Orders</h1>
            <button onclick="logout()" class="back-link">Logout</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date & Time</th>
                        <th>Customer Details</th>
                        <th>Address</th>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody">
                    <!-- Orders will be injected here -->
                </tbody>
            </table>
            <p id="noOrdersMessage" class="no-orders" style="display: none;">No orders have been placed yet.</p>
        </div>

        <button class="clear-btn" onclick="clearOrders()">Delete All Orders</button>
    </div>

    <script>
        // --- SET YOUR PASSWORD HERE ---
        const ADMIN_PASSWORD = "admin123";

        // Check if already logged in this session
        window.onload = function() {
            if(sessionStorage.getItem('elmghary_admin_logged_in') === 'true') {
                showDashboard();
            }
        };

        // Handle Login button click
        function checkLogin() {
            const enteredPass = document.getElementById('adminPass').value;
            if (enteredPass === ADMIN_PASSWORD) {
                sessionStorage.setItem('elmghary_admin_logged_in', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('elmghary_admin_logged_in');
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminPass').value = '';
            document.getElementById('loginError').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadOrders();
        }

        function loadOrders() {
            const tableBody = document.getElementById('orderTableBody');
            const noOrdersMsg = document.getElementById('noOrdersMessage');
            
            let orders = JSON.parse(localStorage.getItem('elmghary_orders')) || [];
            tableBody.innerHTML = ''; 

            if (orders.length === 0) {
                noOrdersMsg.style.display = 'block';
            } else {
                noOrdersMsg.style.display = 'none';
                for (let i = orders.length - 1; i >= 0; i--) {
                    let order = orders[i];
                    let row = `
                        <tr>
                            <td><strong>${order.id}</strong></td>
                            <td style="font-size: 0.9em; color: #555;">${order.date}</td>
                            <td>
                                <strong>${order.name}</strong><br>
                                📱 ${order.phone}<br>
                                ✉️ ${order.email || 'N/A'}
                            </td>
                            <td style="max-width: 200px;">${order.address}</td>
                            <td>${order.product}</td>
                            <td><strong>${order.quantity}</strong></td>
                            <td style="color: #25D366; font-weight: bold;">$${order.total}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                }
            }
        }

        function clearOrders() {
            if(confirm("Are you sure you want to delete all orders? This cannot be undone.")) {
                localStorage.removeItem('elmghary_orders');
                loadOrders();
            }
        }
    </script>
</body>
</html>
